<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Goose Portal Meadow</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #70d6ff; 
            user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #1b4332;
            padding: 15px 20px; border: 4px solid #1b4332; border-radius: 12px;
            box-shadow: 0 6px 0px #1b4332;
            pointer-events: none;
        }
        #hud h1 { margin: 0 0 5px 0; font-size: 20px; text-transform: uppercase; }
        #hud p { margin: 3px 0; font-size: 14px; font-weight: bold; }
        #honk-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 90px; font-weight: 900; color: #ff477e;
            text-shadow: 5px 5px 0px #000, -5px -5px 0px #000, 5px -5px 0px #000, -5px 5px 0px #000;
            opacity: 0; transition: opacity 0.1s ease-in-out; pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #000;
            padding: 10px 15px; border-radius: 8px; font-size: 12px;
            border: 3px solid #1b4332; font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="hud">
        <h1>🪿 Goose Squad</h1>
        <p>Active Geese: <span id="geese-count">1</span></p>
    </div>
    <div id="honk-text">HONK!</div>
    <div id="controls">
        [W, A, S, D] / Arrows : Move<br>
        [SPACE] : HONK!<br>
        <i>Walk into the glowing portal!</i>
    </div>

    <script>
        let scene, mainCamera, renderer, socket;
        let localGoose, localGooseHead;
        let otherGeese = {};
        let keys = {};
        let toonGradientMap;
        const terrainSize = 180;

        // --- PORTAL SYSTEM VARIABLES ---
        let portalA, portalB; // Entrance & Exit Meshes
        let portalCamA, portalCamB; // Cameras rendering portal views
        let renderTargetA, renderTargetB;
        let canTeleport = true;

        // Positions: Portal A in Meadow, Portal B inside Barn
        const posA = new THREE.Vector3(0, 0, 15);
        const posB = new THREE.Vector3(60, 1.5, 60);

        function getHillHeight(x, z) {
            // Keep barn/portal area flat to avoid floor clipping
            if (Math.hypot(x - 60, z - 60) < 25) return 0; 
            const h1 = Math.sin(x * 0.08) * 5.0 + Math.cos(z * 0.08) * 5.0;
            const h2 = Math.sin((x + z) * 0.04) * 6.0;
            return h1 + h2;
        }

        function createToonMaterial(colorHex) {
            return new THREE.MeshToonMaterial({ color: colorHex, gradientMap: toonGradientMap });
        }

        function attachOutline(mesh, outlineScale = 1.08) {
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
            const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
            outlineMesh.scale.set(outlineScale, outlineScale, outlineScale);
            mesh.add(outlineMesh);
        }

        function buildGooseMesh(accentColor = 0xff7b00) {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
            bodyGeo.scale(1, 0.85, 1.4);
            const body = new THREE.Mesh(bodyGeo, createToonMaterial(0xffffff));
            body.position.y = 1;
            attachOutline(body, 1.08);
            group.add(body);

            // Neck & Head
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 1.1, -0.8);

            const neckGeo = new THREE.CylinderGeometry(0.2, 0.35, 1.3, 8);
            const neck = new THREE.Mesh(neckGeo, createToonMaterial(0xffffff));
            neck.position.set(0, 0.65, 0);
            neck.rotation.x = -0.25;
            attachOutline(neck, 1.12);
            headGroup.add(neck);

            // Beak
            const beakGeo = new THREE.ConeGeometry(0.2, 0.7, 8);
            const beak = new THREE.Mesh(beakGeo, createToonMaterial(accentColor));
            beak.position.set(0, 1.1, -0.45);
            beak.rotation.x = -Math.PI / 2;
            attachOutline(beak, 1.15);
            headGroup.add(beak);

            group.add(headGroup);
            return { group, headGroup };
        }

        function init() {
            socket = io();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70d6ff);
            scene.fog = new THREE.FogExp2(0x70d6ff, 0.005);

            mainCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Toon Texture
            const canvas = document.createElement('canvas');
            canvas.width = 4; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 1, 1);
            ctx.fillStyle = '#888'; ctx.fillRect(1, 0, 1, 1);
            ctx.fillStyle = '#fff'; ctx.fillRect(2, 0, 2, 1);
            toonGradientMap = new THREE.CanvasTexture(canvas);
            toonGradientMap.minFilter = THREE.NearestFilter;
            toonGradientMap.magFilter = THREE.NearestFilter;

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const dirLight = new THREE.DirectionalLight(0xfffae0, 0.9);
            dirLight.position.set(50, 80, 30);
            scene.add(dirLight);

            createTerrain();
            createBarn();
            setupPortals();

            // Local Player
            const localMesh = buildGooseMesh(0xff5722);
            localGoose = localMesh.group;
            localGooseHead = localMesh.headGroup;
            scene.add(localGoose);

            // Network Handlers
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(players[id]);
                });
                updatePlayerCount();
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(playerInfo);
                updatePlayerCount();
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherGeese[playerInfo.id]) {
                    const g = otherGeese[playerInfo.id].group;
                    g.position.x = playerInfo.x;
                    g.position.z = playerInfo.z;
                    g.position.y = getHillHeight(playerInfo.x, playerInfo.z);
                    g.rotation.y = playerInfo.rotation;
                }
            });

            socket.on('playerHonked', (id) => {
                if (otherGeese[id]) {
                    const h = otherGeese[id].headGroup;
                    h.rotation.x = -0.4;
                    setTimeout(() => { h.rotation.x = 0; }, 200);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherGeese[id]) {
                    scene.remove(otherGeese[id].group);
                    delete otherGeese[id];
                    updatePlayerCount();
                }
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'Space') {
                    honk();
                    socket.emit('honk');
                }
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            animate();
        }

        // --- BARN BUILDER ---
        function createBarn() {
            const barn = new THREE.Group();
            barn.position.set(60, 0, 60);

            // Red Barn Body
            const wallsGeo = new THREE.BoxGeometry(16, 10, 20);
            const walls = new THREE.Mesh(wallsGeo, createToonMaterial(0xcc2222));
            walls.position.y = 5;
            attachOutline(walls, 1.03);
            barn.add(walls);

            // Roof
            const roofGeo = new THREE.ConeGeometry(13, 6, 4);
            const roof = new THREE.Mesh(roofGeo, createToonMaterial(0x442211));
            roof.position.y = 13;
            roof.rotation.y = Math.PI / 4;
            attachOutline(roof, 1.03);
            barn.add(roof);

            // Doorway Hole (Cutout visualization)
            const doorGeo = new THREE.PlaneGeometry(5, 7);
            const doorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 3.5, -10.01);
            door.rotation.y = Math.PI;
            barn.add(door);

            scene.add(barn);
        }

        // --- SEAMLESS LIVE PORTAL SETUP ---
        function setupPortals() {
            posA.y = getHillHeight(posA.x, posA.z) + 3;

            renderTargetA = new THREE.WebGLRenderTarget(1024, 1024);
            renderTargetB = new THREE.WebGLRenderTarget(1024, 1024);

            portalCamA = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
            portalCamB = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

            // Frame Geometry
            const frameGeo = new THREE.TorusGeometry(3, 0.3, 12, 24);
            const frameMat = createToonMaterial(0xff0077);

            // Portal Screen Geometry
            const screenGeo = new THREE.CircleGeometry(2.8, 32);

            // PORTAL A (In the Meadow)
            portalA = new THREE.Group();
            portalA.position.copy(posA);

            const frameA = new THREE.Mesh(frameGeo, frameMat);
            attachOutline(frameA, 1.05);
            portalA.add(frameA);

            const screenA = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ map: renderTargetB.texture }));
            portalA.add(screenA);
            scene.add(portalA);

            // PORTAL B (Inside Barn)
            portalB = new THREE.Group();
            portalB.position.copy(posB);

            const frameB = new THREE.Mesh(frameGeo, frameMat);
            attachOutline(frameB, 1.05);
            portalB.add(frameB);

            const screenB = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ map: renderTargetA.texture }));
            portalB.add(screenB);
            scene.add(portalB);
        }

        function createTerrain() {
            const floorGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 96, 96);
            floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setY(i, getHillHeight(pos.getX(i), pos.getZ(i)));
            }
            floorGeo.computeVertexNormals();
            scene.add(new THREE.Mesh(floorGeo, createToonMaterial(0x38b000)));
        }

        function addOtherPlayer(info) {
            const gooseData = buildGooseMesh(info.color);
            gooseData.group.position.set(info.x, getHillHeight(info.x, info.z), info.z);
            scene.add(gooseData.group);
            otherGeese[info.id] = gooseData;
        }

        function updatePlayerCount() {
            document.getElementById('geese-count').innerText = Object.keys(otherGeese).length + 1;
        }

        function honk() {
            const honkUI = document.getElementById('honk-text');
            honkUI.style.opacity = '1';
            setTimeout(() => { honkUI.style.opacity = '0'; }, 300);
            
            localGooseHead.rotation.x = -0.4;
            setTimeout(() => { localGooseHead.rotation.x = 0; }, 200);
        }

        function updatePortals() {
            // Update camera view for Portal A (Looking out of Portal B inside Barn)
            portalCamA.position.copy(posB);
            portalCamA.rotation.copy(mainCamera.rotation);
            portalA.visible = false;
            renderer.setRenderTarget(renderTargetA);
            renderer.render(scene, portalCamA);
            portalA.visible = true;

            // Update camera view for Portal B (Looking out of Portal A in Meadow)
            portalCamB.position.copy(posA);
            portalCamB.rotation.copy(mainCamera.rotation);
            portalB.visible = false;
            renderer.setRenderTarget(renderTargetB);
            renderer.render(scene, portalCamB);
            portalB.visible = true;

            renderer.setRenderTarget(null);
        }

        function checkPortalTeleport() {
            if (!canTeleport) return;

            // Teleport A -> B
            if (localGoose.position.distanceTo(posA) < 2.5) {
                localGoose.position.copy(posB);
                localGoose.position.z += 3; // Step out of portal frame
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            } 
            // Teleport B -> A
            else if (localGoose.position.distanceTo(posB) < 2.5) {
                localGoose.position.copy(posA);
                localGoose.position.z += 3;
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let moved = false;
            const moveSpeed = 0.28;
            const rotSpeed = 0.05;

            if (keys['KeyW'] || keys['ArrowUp']) { localGoose.translateZ(-moveSpeed); moved = true; }
            if (keys['KeyS'] || keys['ArrowDown']) { localGoose.translateZ(moveSpeed); moved = true; }
            if (keys['KeyA'] || keys['ArrowLeft']) { localGoose.rotation.y += rotSpeed; moved = true; }
            if (keys['KeyD'] || keys['ArrowRight']) { localGoose.rotation.y -= rotSpeed; moved = true; }

            localGoose.position.y = getHillHeight(localGoose.position.x, localGoose.position.z);

            checkPortalTeleport();

            if (moved) {
                socket.emit('playerMovement', {
                    x: localGoose.position.x,
                    z: localGoose.position.z,
                    rotation: localGoose.rotation.y
                });
            }

            // Camera follow
            const cameraOffset = new THREE.Vector3(0, 11, 16).applyAxisAngle(new THREE.Vector3(0, 1, 0), localGoose.rotation.y);
            mainCamera.position.copy(localGoose.position).add(cameraOffset);
            mainCamera.lookAt(localGoose.position.x, localGoose.position.y + 1.5, localGoose.position.z);

            // Render live portal views before main frame render
            updatePortals();

            renderer.render(scene, mainCamera);
        }

        window.onload = init;
    </script>
</body>
</html>
