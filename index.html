<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Goose First-Person Portals</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #70d6ff; 
            user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #1b4332;
            padding: 15px 20px; border: 4px solid #1b4332; border-radius: 12px;
            box-shadow: 0 6px 0px #1b4332;
            pointer-events: none;
        }
        #hud h1 { margin: 0 0 5px 0; font-size: 20px; text-transform: uppercase; }
        #hud p { margin: 3px 0; font-size: 14px; font-weight: bold; }
        #honk-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 90px; font-weight: 900; color: #ff477e;
            text-shadow: 5px 5px 0px #000, -5px -5px 0px #000, 5px -5px 0px #000, -5px 5px 0px #000;
            opacity: 0; transition: opacity 0.1s ease-in-out; pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #000;
            padding: 10px 15px; border-radius: 8px; font-size: 12px;
            border: 3px solid #1b4332; font-weight: bold;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #000;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">
        <h1>🪿 First-Person Goose</h1>
        <p>Active Geese: <span id="geese-count">1</span></p>
    </div>
    <div id="honk-text">HONK!</div>
    <div id="controls">
        [W, A, S, D] / Arrows : Walk<br>
        [SPACE] : HONK!<br>
        Walk through the portal to enter the barn!
    </div>

    <script>
        let scene, mainCamera, renderer, socket;
        let localGoose, localGooseHead, beakMesh;
        let otherGeese = {};
        let keys = {};
        let toonGradientMap;
        const terrainSize = 180;

        // --- PORTAL SYSTEM VARIABLES ---
        let portalA, portalB; 
        let portalCamA, portalCamB; 
        let renderTargetA, renderTargetB;
        let canTeleport = true;

        // Portal A in Meadow, Portal B inside Hollow Barn
        const posA = new THREE.Vector3(0, 0, 15);
        const posB = new THREE.Vector3(60, 1.5, 60);

        function getHillHeight(x, z) {
            // Keep barn interior and portal areas perfectly flat
            if (Math.hypot(x - 60, z - 60) < 18) return 0.05; 
            const h1 = Math.sin(x * 0.08) * 5.0 + Math.cos(z * 0.08) * 5.0;
            const h2 = Math.sin((x + z) * 0.04) * 6.0;
            return h1 + h2;
        }

        function createToonMaterial(colorHex, side = THREE.FrontSide) {
            return new THREE.MeshToonMaterial({ 
                color: colorHex, 
                gradientMap: toonGradientMap,
                side: side 
            });
        }

        function attachOutline(mesh, outlineScale = 1.08) {
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
            const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
            outlineMesh.scale.set(outlineScale, outlineScale, outlineScale);
            mesh.add(outlineMesh);
        }

        function buildGooseMesh(accentColor = 0xff7b00, isLocal = false) {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
            bodyGeo.scale(1, 0.85, 1.4);
            const body = new THREE.Mesh(bodyGeo, createToonMaterial(0xffffff));
            body.position.y = 1;
            attachOutline(body, 1.08);
            group.add(body);

            // Neck & Head
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 1.1, -0.8);

            const neckGeo = new THREE.CylinderGeometry(0.2, 0.35, 1.3, 8);
            const neck = new THREE.Mesh(neckGeo, createToonMaterial(0xffffff));
            neck.position.set(0, 0.65, 0);
            neck.rotation.x = -0.25;
            attachOutline(neck, 1.12);
            headGroup.add(neck);

            // Beak
            const beakGeo = new THREE.ConeGeometry(0.2, 0.7, 8);
            const beak = new THREE.Mesh(beakGeo, createToonMaterial(accentColor));
            beak.position.set(0, 1.1, -0.45);
            beak.rotation.x = -Math.PI / 2;
            attachOutline(beak, 1.15);
            headGroup.add(beak);

            group.add(headGroup);

            // Hide body for local first-person player so it doesn't block vision
            if (isLocal) {
                body.visible = false;
                neck.visible = false;
            }

            return { group, headGroup, beak };
        }

        function init() {
            socket = io();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70d6ff);
            scene.fog = new THREE.FogExp2(0x70d6ff, 0.005);

            mainCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Toon Texture
            const canvas = document.createElement('canvas');
            canvas.width = 4; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 1, 1);
            ctx.fillStyle = '#888'; ctx.fillRect(1, 0, 1, 1);
            ctx.fillStyle = '#fff'; ctx.fillRect(2, 0, 2, 1);
            toonGradientMap = new THREE.CanvasTexture(canvas);
            toonGradientMap.minFilter = THREE.NearestFilter;
            toonGradientMap.magFilter = THREE.NearestFilter;

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const dirLight = new THREE.DirectionalLight(0xfffae0, 0.9);
            dirLight.position.set(50, 80, 30);
            scene.add(dirLight);

            createTerrain();
            createHollowBarn();
            setupPortals();

            // Local First-Person Player
            const localMesh = buildGooseMesh(0xff5722, true);
            localGoose = localMesh.group;
            localGooseHead = localMesh.headGroup;
            beakMesh = localMesh.beak;
            scene.add(localGoose);

            // Attach camera inside goose head for First-Person
            localGooseHead.add(mainCamera);
            mainCamera.position.set(0, 1.25, -0.3);

            // Network Handlers
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(players[id]);
                });
                updatePlayerCount();
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(playerInfo);
                updatePlayerCount();
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherGeese[playerInfo.id]) {
                    const g = otherGeese[playerInfo.id].group;
                    g.position.x = playerInfo.x;
                    g.position.z = playerInfo.z;
                    g.position.y = getHillHeight(playerInfo.x, playerInfo.z);
                    g.rotation.y = playerInfo.rotation;
                }
            });

            socket.on('playerHonked', (id) => {
                if (otherGeese[id]) {
                    const h = otherGeese[id].headGroup;
                    h.rotation.x = -0.4;
                    setTimeout(() => { h.rotation.x = 0; }, 200);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherGeese[id]) {
                    scene.remove(otherGeese[id].group);
                    delete otherGeese[id];
                    updatePlayerCount();
                }
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'Space') {
                    honk();
                    socket.emit('honk');
                }
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            animate();
        }

        // --- HOLLOW BARN WITH INTERIOR ---
        function createHollowBarn() {
            const barn = new THREE.Group();
            barn.position.set(60, 0, 60);

            const redMat = createToonMaterial(0xcc2222, THREE.DoubleSide);
            const woodMat = createToonMaterial(0x8b5a2b, THREE.DoubleSide);
            const darkRoofMat = createToonMaterial(0x3a1e05, THREE.DoubleSide);

            // Barn Floor inside
            const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(18, 22), woodMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.y = 0.1;
            barn.add(floorMesh);

            // Left & Right Outer Walls
            const sideWallGeo = new THREE.BoxGeometry(0.6, 9, 22);
            const leftWall = new THREE.Mesh(sideWallGeo, redMat);
            leftWall.position.set(-9, 4.5, 0);
            attachOutline(leftWall, 1.02);
            barn.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeo, redMat);
            rightWall.position.set(9, 4.5, 0);
            attachOutline(rightWall, 1.02);
            barn.add(rightWall);

            // Back Wall
            const backWallGeo = new THREE.BoxGeometry(18, 9, 0.6);
            const backWall = new THREE.Mesh(backWallGeo, redMat);
            backWall.position.set(0, 4.5, 11);
            attachOutline(backWall, 1.02);
            barn.add(backWall);

            // Front Walls with Open Doorway in Center
            const frontWallGeo = new THREE.BoxGeometry(6, 9, 0.6);
            const frontLeft = new THREE.Mesh(frontWallGeo, redMat);
            frontLeft.position.set(-6, 4.5, -11);
            attachOutline(frontLeft, 1.02);
            barn.add(frontLeft);

            const frontRight = new THREE.Mesh(frontWallGeo, redMat);
            frontRight.position.set(6, 4.5, -11);
            attachOutline(frontRight, 1.02);
            barn.add(frontRight);

            // Roof (Pitched Slants)
            const roofGeo = new THREE.BoxGeometry(11, 0.5, 23);
            const leftRoof = new THREE.Mesh(roofGeo, darkRoofMat);
            leftRoof.position.set(-4.5, 11, 0);
            leftRoof.rotation.z = 0.35;
            attachOutline(leftRoof, 1.02);
            barn.add(leftRoof);

            const rightRoof = new THREE.Mesh(roofGeo, darkRoofMat);
            rightRoof.position.set(4.5, 11, 0);
            rightRoof.rotation.z = -0.35;
            attachOutline(rightRoof, 1.02);
            barn.add(rightRoof);

            scene.add(barn);
        }

        // --- SEAMLESS LIVE PORTALS ---
        function setupPortals() {
            posA.y = getHillHeight(posA.x, posA.z) + 3;

            renderTargetA = new THREE.WebGLRenderTarget(1024, 1024);
            renderTargetB = new THREE.WebGLRenderTarget(1024, 1024);

            portalCamA = new THREE.PerspectiveCamera(75, 1, 0.1, 500);
            portalCamB = new THREE.PerspectiveCamera(75, 1, 0.1, 500);

            const frameGeo = new THREE.TorusGeometry(3, 0.3, 12, 24);
            const frameMat = createToonMaterial(0xff0077);
            const screenGeo = new THREE.CircleGeometry(2.8, 32);

            // PORTAL A (Meadow)
            portalA = new THREE.Group();
            portalA.position.copy(posA);

            const frameA = new THREE.Mesh(frameGeo, frameMat);
            attachOutline(frameA, 1.05);
            portalA.add(frameA);

            const screenA = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ map: renderTargetB.texture }));
            portalA.add(screenA);
            scene.add(portalA);

            // PORTAL B (Inside Barn)
            portalB = new THREE.Group();
            portalB.position.copy(posB);

            const frameB = new THREE.Mesh(frameGeo, frameMat);
            attachOutline(frameB, 1.05);
            portalB.add(frameB);

            const screenB = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ map: renderTargetA.texture }));
            portalB.add(screenB);
            scene.add(portalB);
        }

        function createTerrain() {
            const floorGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 96, 96);
            floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setY(i, getHillHeight(pos.getX(i), pos.getZ(i)));
            }
            floorGeo.computeVertexNormals();
            scene.add(new THREE.Mesh(floorGeo, createToonMaterial(0x38b000)));
        }

        function addOtherPlayer(info) {
            const gooseData = buildGooseMesh(info.color, false);
            gooseData.group.position.set(info.x, getHillHeight(info.x, info.z), info.z);
            scene.add(gooseData.group);
            otherGeese[info.id] = gooseData;
        }

        function updatePlayerCount() {
            document.getElementById('geese-count').innerText = Object.keys(otherGeese).length + 1;
        }

        function honk() {
            const honkUI = document.getElementById('honk-text');
            honkUI.style.opacity = '1';
            setTimeout(() => { honkUI.style.opacity = '0'; }, 300);
            
            localGooseHead.rotation.x = -0.4;
            setTimeout(() => { localGooseHead.rotation.x = 0; }, 200);
        }

        function updatePortals() {
            // Compute First-Person Camera Matrix for Portal A -> B
            const playerRelA = localGoose.position.clone().sub(posA);
            portalCamA.position.copy(posB).add(playerRelA);
            portalCamA.rotation.copy(localGoose.rotation);

            portalA.visible = false;
            renderer.setRenderTarget(renderTargetA);
            renderer.render(scene, portalCamA);
            portalA.visible = true;

            // Compute First-Person Camera Matrix for Portal B -> A
            const playerRelB = localGoose.position.clone().sub(posB);
            portalCamB.position.copy(posA).add(playerRelB);
            portalCamB.rotation.copy(localGoose.rotation);

            portalB.visible = false;
            renderer.setRenderTarget(renderTargetB);
            renderer.render(scene, portalCamB);
            portalB.visible = true;

            renderer.setRenderTarget(null);
        }

        function checkPortalTeleport() {
            if (!canTeleport) return;

            // Teleport Meadow -> Barn
            if (localGoose.position.distanceTo(posA) < 2.5) {
                localGoose.position.copy(posB);
                localGoose.position.z += 3.5;
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            } 
            // Teleport Barn -> Meadow
            else if (localGoose.position.distanceTo(posB) < 2.5) {
                localGoose.position.copy(posA);
                localGoose.position.z += 3.5;
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let moved = false;
            const moveSpeed = 0.28;
            const rotSpeed = 0.05;

            if (keys['KeyW'] || keys['ArrowUp']) { localGoose.translateZ(-moveSpeed); moved = true; }
            if (keys['KeyS'] || keys['ArrowDown']) { localGoose.translateZ(moveSpeed); moved = true; }
            if (keys['KeyA'] || keys['ArrowLeft']) { localGoose.rotation.y += rotSpeed; moved = true; }
            if (keys['KeyD'] || keys['ArrowRight']) { localGoose.rotation.y -= rotSpeed; moved = true; }

            localGoose.position.y = getHillHeight(localGoose.position.x, localGoose.position.z);

            checkPortalTeleport();

            if (moved) {
                socket.emit('playerMovement', {
                    x: localGoose.position.x,
                    z: localGoose.position.z,
                    rotation: localGoose.rotation.y
                });
            }

            // Sync First-Person Portal Camera Feeds
            updatePortals();

            renderer.render(scene, mainCamera);
        }

        window.onload = init;
    </script>
</body>
</html>
