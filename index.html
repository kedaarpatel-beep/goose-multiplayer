<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer FPS Goose World - Kanye Attack Edition</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #70d6ff; 
            user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; cursor: pointer; }
        
        /* Login & Server/Map Screen */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(112, 214, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        #login-box {
            background: #ffffff; border: 4px solid #1b4332; border-radius: 16px;
            padding: 30px 40px; text-align: center; box-shadow: 0 10px 0 #1b4332;
            width: 320px;
        }
        #login-box h1 { margin-top: 0; color: #1b4332; font-size: 26px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #1b4332; }
        #nickname-input, #map-select {
            width: 100%; padding: 10px; font-size: 15px; font-family: inherit;
            border: 3px solid #1b4332; border-radius: 8px; font-weight: bold; outline: none;
            box-sizing: border-box;
        }
        #play-btn {
            background: #ff477e; color: #ffffff; font-size: 18px; font-weight: bold;
            padding: 12px 28px; border: 3px solid #000; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 0 #000; transition: transform 0.1s;
            width: 100%; margin-top: 10px;
        }
        #play-btn:active { transform: translateY(4px); box-shadow: none; }

        /* HUD & Controls */
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #1b4332;
            padding: 15px 20px; border: 4px solid #1b4332; border-radius: 12px;
            box-shadow: 0 6px 0px #1b4332; pointer-events: none;
        }
        #hud h1 { margin: 0 0 5px 0; font-size: 20px; text-transform: uppercase; }
        #hud p { margin: 3px 0; font-size: 14px; font-weight: bold; }
        
        #honk-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: 900; color: #ff477e;
            text-shadow: 5px 5px 0px #000, -5px -5px 0px #000, 5px -5px 0px #000, -5px 5px 0px #000;
            opacity: 0; transition: opacity 0.1s ease-in-out; pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9); color: #000;
            padding: 10px 15px; border-radius: 8px; font-size: 12px;
            border: 3px solid #1b4332; font-weight: bold; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: #ff477e;
            border: 2px solid #000000; border-radius: 50%; pointer-events: none;
        }

        /* Chat Overlay */
        #chat-container {
            position: absolute; bottom: 20px; right: 20px; width: 320px;
            background: rgba(255, 255, 255, 0.9); border: 3px solid #1b4332;
            border-radius: 10px; padding: 10px; box-shadow: 0 4px 0 #1b4332;
            display: flex; flex-direction: column; z-index: 10;
        }
        #chat-messages {
            height: 140px; overflow-y: auto; font-size: 13px; font-weight: bold;
            margin-bottom: 8px; color: #1b4332; word-wrap: break-word;
        }
        #chat-messages p { margin: 4px 0; }
        #chat-input {
            width: 90%; padding: 8px; font-family: inherit; font-size: 12px;
            border: 2px solid #1b4332; border-radius: 6px; outline: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="login-screen">
        <div id="login-box">
            <h1>🪿 GOOSE VS YE</h1>
            <div class="input-group">
                <label for="nickname-input">Goose Name:</label>
                <input type="text" id="nickname-input" placeholder="Enter Goose Name..." maxlength="12" value="Goose" />
            </div>
            <div class="input-group">
                <label for="map-select">Select Map / Arena:</label>
                <select id="map-select">
                    <option value="meadow">🌿 Meadow Hills</option>
                    <option value="desert">🏜️ Desert Wasteland</option>
                    <option value="cyber">🌆 Cyber Neon Grid</option>
                </select>
            </div>
            <button id="play-btn" onclick="joinGame()">EQUIP MIC & PLAY!</button>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">
        <h1>🎙️ Mic Melee FPS</h1>
        <p>Active Geese: <span id="geese-count">1</span></p>
        <p>Hostile Kanyes: <span id="kanye-count">0</span></p>
        <p>Kanyes Defeated: <span id="score-count">0</span></p>
    </div>
    <div id="honk-text">MIC SLAM!</div>
    <div id="controls">
        <b>CLICK SCREEN TO LOCK MOUSE</b><br>
        [W, A, S, D] : Walk<br>
        [SPACE] : Jump<br>
        [LEFT CLICK / E] : Mic Sword Attack!<br>
        [K] : SPAWN HOSTILE KANYE<br>
        [T / ENTER] : Open Chat
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Press T to chat..." maxlength="60" />
    </div>

    <script>
        let scene, mainCamera, renderer, socket;
        let localGoose, pitchObject, micWeaponGroup;
        let otherGeese = {};
        let kanyeNPCs = [];
        let kanyeTexture;
        let keys = {};
        let toonGradientMap;
        const terrainSize = 450;
        let playerNickname = "Goose";
        let currentMap = "meadow";
        let score = 0;

        // Weapon Animation & Physics
        let isAttacking = false;
        let attackProgress = 0;
        let isPointerLocked = false;
        let velocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        const jumpStrength = 0.35;

        // Portals System
        let portalBarn, portalBarnScreen;
        let portalOutside, portalOutsideScreen;
        let portalCamToMeadow, renderTargetMeadow;
        let portalCamToBarn, renderTargetBarn;
        let canTeleport = true;

        const posOutside = new THREE.Vector3(0, 0, 15);
        const posBarn = new THREE.Vector3(60, 3.2, 60);

        function getHillHeight(x, z) {
            if (currentMap === "desert") return Math.sin(x * 0.05) * 4.0 + Math.cos(z * 0.05) * 4.0;
            if (currentMap === "cyber") return 0; // Flat neon arena
            if (Math.hypot(x - 60, z - 60) < 22) return 0.05; 
            const h1 = Math.sin(x * 0.03) * 8.0 + Math.cos(z * 0.03) * 8.0;
            const h2 = Math.sin((x + z) * 0.015) * 10.0;
            return h1 + h2;
        }

        function createToonMaterial(colorHex, side = THREE.FrontSide) {
            return new THREE.MeshToonMaterial({ 
                color: colorHex, 
                gradientMap: toonGradientMap,
                side: side 
            });
        }

        function attachOutline(mesh, outlineScale = 1.08) {
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
            const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
            outlineMesh.scale.set(outlineScale, outlineScale, outlineScale);
            mesh.add(outlineMesh);
        }

        /* --- 🎙️ MICROPHONE SWORD WEAPON BUILDER --- */
        function createMicrophoneWeapon() {
            const micGroup = new THREE.Group();

            // Metallic Handle
            const handleGeo = new THREE.CylinderGeometry(0.04, 0.03, 0.8, 12);
            const handleMat = createToonMaterial(0x222222);
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.2;
            attachOutline(handle, 1.1);
            micGroup.add(handle);

            // Silver Ring
            const ringGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.06, 12);
            const ringMat = createToonMaterial(0xcccccc);
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 0.55;
            micGroup.add(ring);

            // Microphone Mesh/Grille Head
            const headGeo = new THREE.SphereGeometry(0.09, 14, 14);
            const headMat = createToonMaterial(0xdddddd);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.65;
            attachOutline(head, 1.12);
            micGroup.add(head);

            // Position in First-Person view (Right hand stance)
            micGroup.position.set(0.4, -0.3, -0.6);
            micGroup.rotation.set(0.2, -0.3, -0.2);

            return micGroup;
        }

        function createNametagSprite(nickname) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, 256, 64);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 256, 64);

            ctx.font = 'Bold 28px Courier New';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(nickname, 128, 42);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3, 0.75, 1);
            sprite.position.y = 2.8;
            return sprite;
        }

        function buildGooseMesh(accentColor = 0xff7b00, isLocal = false, nickname = "Goose") {
            const group = new THREE.Group();
            if (isLocal) return { group, headGroup: group };

            const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
            bodyGeo.scale(1, 0.85, 1.4);
            const body = new THREE.Mesh(bodyGeo, createToonMaterial(0xffffff));
            body.position.y = 1;
            attachOutline(body, 1.08);
            group.add(body);

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 1.1, -0.8);

            const neckGeo = new THREE.CylinderGeometry(0.2, 0.35, 1.3, 8);
            const neck = new THREE.Mesh(neckGeo, createToonMaterial(0xffffff));
            neck.position.set(0, 0.65, 0);
            neck.rotation.x = -0.25;
            attachOutline(neck, 1.12);
            headGroup.add(neck);

            const beakGeo = new THREE.ConeGeometry(0.2, 0.7, 8);
            const beak = new THREE.Mesh(beakGeo, createToonMaterial(accentColor));
            beak.position.set(0, 1.1, -0.45);
            beak.rotation.x = -Math.PI / 2;
            attachOutline(beak, 1.15);
            headGroup.add(beak);

            group.add(headGroup);

            const nametag = createNametagSprite(nickname);
            group.add(nametag);

            return { group, headGroup };
        }

        /* --- KANYE WEST HOSTILE NPC SYSTEM --- */
        function createKanyeHeadTextureFallback() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#8d5524';
            ctx.beginPath(); ctx.arc(64, 64, 50, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#111';
            ctx.fillRect(25, 45, 32, 22);
            ctx.fillRect(71, 45, 32, 22);
            ctx.fillRect(55, 52, 18, 5);

            ctx.strokeStyle = '#3a1e05';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(64, 85, 15, 0, Math.PI); ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function spawnKanyeNPC(x, z) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.7, 2.2, 10);
            const bodyMat = createToonMaterial(0x111111);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.1;
            attachOutline(body, 1.08);
            group.add(body);

            const spriteMat = new THREE.SpriteMaterial({ map: kanyeTexture, transparent: true });
            const headSprite = new THREE.Sprite(spriteMat);
            headSprite.scale.set(2.5, 2.5, 1);
            headSprite.position.y = 2.8;
            group.add(headSprite);

            const tag = createNametagSprite("HOSTILE YE");
            tag.position.y = 4.2;
            group.add(tag);

            const initialY = getHillHeight(x, z);
            group.position.set(x, initialY, z);
            scene.add(group);

            const npc = {
                mesh: group,
                speed: 0.12 + Math.random() * 0.05, // Fast hostile speed
                health: 100
            };

            kanyeNPCs.push(npc);
            document.getElementById('kanye-count').innerText = kanyeNPCs.length;
        }

        /* HOSTILE AI: Chases nearest player immediately */
        function updateKanyeNPCs() {
            const allPlayers = [localGoose.position];
            Object.values(otherGeese).forEach(og => {
                if (og && og.group) allPlayers.push(og.group.position);
            });

            kanyeNPCs.forEach((npc, index) => {
                const pos = npc.mesh.position;
                
                // Find nearest player target
                let nearestPlayerPos = null;
                let minDistSq = Infinity;

                allPlayers.forEach(pPos => {
                    const dx = pPos.x - pos.x;
                    const dz = pPos.z - pos.z;
                    const distSq = dx * dx + dz * dz;
                    if (distSq < minDistSq) {
                        minDistSq = distSq;
                        nearestPlayerPos = pPos;
                    }
                });

                if (nearestPlayerPos) {
                    const angle = Math.atan2(nearestPlayerPos.x - pos.x, nearestPlayerPos.z - pos.z);
                    pos.x += Math.sin(angle) * npc.speed;
                    pos.z += Math.cos(angle) * npc.speed;
                    pos.y = getHillHeight(pos.x, pos.z);
                    npc.mesh.rotation.y = angle;
                }
            });
        }

        function createTree(x, z) {
            const tree = new THREE.Group();
            const y = getHillHeight(x, z);
            tree.position.set(x, y, z);

            const scale = 0.8 + Math.random() * 0.6;
            tree.scale.set(scale, scale, scale);

            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.7, 4, 7);
            const trunkMat = createToonMaterial(0x5c3d2e);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            attachOutline(trunk, 1.1);
            tree.add(trunk);

            const greenShades = currentMap === "desert" ? [0xd4a373, 0xccd5ae] : [0x2b9348, 0x55a630, 0x80b918];
            const leafMat = createToonMaterial(greenShades[Math.floor(Math.random() * greenShades.length)]);

            for (let i = 0; i < 3; i++) {
                const coneGeo = new THREE.ConeGeometry(3.2 - i * 0.8, 3.5, 7);
                const cone = new THREE.Mesh(coneGeo, leafMat);
                cone.position.y = 3.5 + i * 2.1;
                attachOutline(cone, 1.08);
                tree.add(cone);
            }

            scene.add(tree);
        }

        function generateForest() {
            if (currentMap === "cyber") return;
            for (let i = 0; i < 240; i++) {
                const x = (Math.random() - 0.5) * (terrainSize - 40);
                const z = (Math.random() - 0.5) * (terrainSize - 40);
                if (Math.hypot(x - 60, z - 60) > 25 && Math.hypot(x, z) > 12) {
                    createTree(x, z);
                }
            }
        }

        function joinGame() {
            const input = document.getElementById('nickname-input');
            if (input.value.trim() !== "") {
                playerNickname = input.value.trim();
            }
            currentMap = document.getElementById('map-select').value;
            document.getElementById('login-screen').style.display = 'none';
            
            applyMapTheme();

            const container = document.getElementById('canvas-container');
            container.requestPointerLock();
            
            if (socket) {
                socket.emit('setNickname', playerNickname);
            }
        }

        function applyMapTheme() {
            if (currentMap === "desert") {
                scene.background = new THREE.Color(0xf2cc8f);
                scene.fog.color = new THREE.Color(0xf2cc8f);
            } else if (currentMap === "cyber") {
                scene.background = new THREE.Color(0x0d0221);
                scene.fog.color = new THREE.Color(0x0d0221);
            } else {
                scene.background = new THREE.Color(0x70d6ff);
                scene.fog.color = new THREE.Color(0x70d6ff);
            }
            createTerrain();
            generateForest();
        }

        function init() {
            socket = io();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70d6ff);
            scene.fog = new THREE.FogExp2(0x70d6ff, 0.0035);

            mainCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            localGoose = new THREE.Group();
            pitchObject = new THREE.Group();
            pitchObject.position.y = 1.6;
            
            // Attach Camera & Microphone Sword to local Goose View
            pitchObject.add(mainCamera);
            micWeaponGroup = createMicrophoneWeapon();
            pitchObject.add(micWeaponGroup);

            localGoose.add(pitchObject);
            scene.add(localGoose);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            const container = document.getElementById('canvas-container');
            container.appendChild(renderer.domElement);

            container.addEventListener('click', () => {
                if (document.activeElement !== document.getElementById('chat-input')) {
                    container.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                const mouseSensitivity = 0.002;
                localGoose.rotation.y -= e.movementX * mouseSensitivity;
                pitchObject.rotation.x -= e.movementY * mouseSensitivity;
                pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
            });

            // Toon Texture
            const canvas = document.createElement('canvas');
            canvas.width = 4; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 1, 1);
            ctx.fillStyle = '#888'; ctx.fillRect(1, 0, 1, 1);
            ctx.fillStyle = '#fff'; ctx.fillRect(2, 0, 2, 1);
            toonGradientMap = new THREE.CanvasTexture(canvas);
            toonGradientMap.minFilter = THREE.NearestFilter;
            toonGradientMap.magFilter = THREE.NearestFilter;

            // Load Kanye Image Texture
            const textureLoader = new THREE.TextureLoader();
            kanyeTexture = textureLoader.load(
                'kanye.png',
                undefined,
                undefined,
                () => { kanyeTexture = createKanyeHeadTextureFallback(); }
            );

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const dirLight = new THREE.DirectionalLight(0xfffae0, 0.9);
            dirLight.position.set(100, 120, 50);
            scene.add(dirLight);

            createHollowBarn();
            setupTwoWayPortals();

            // Initial Hostile Kanye Squad
            for (let i = 0; i < 15; i++) {
                const rx = (Math.random() - 0.5) * (terrainSize - 100);
                const rz = (Math.random() - 0.5) * (terrainSize - 100);
                spawnKanyeNPC(rx, rz);
            }

            // Socket Listeners
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(players[id]);
                });
                updatePlayerCount();
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(playerInfo);
                updatePlayerCount();
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherGeese[playerInfo.id]) {
                    const g = otherGeese[playerInfo.id].group;
                    g.position.x = playerInfo.x;
                    g.position.z = playerInfo.z;
                    g.position.y = getHillHeight(playerInfo.x, playerInfo.z);
                    g.rotation.y = playerInfo.rotation;
                }
            });

            socket.on('chatMessage', (data) => {
                appendChatMessage(data.nickname, data.message);
            });

            socket.on('playerHonked', (id) => {
                if (otherGeese[id]) {
                    const h = otherGeese[id].headGroup;
                    h.rotation.x = -0.4;
                    setTimeout(() => { h.rotation.x = 0; }, 200);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherGeese[id]) {
                    scene.remove(otherGeese[id].group);
                    delete otherGeese[id];
                    updatePlayerCount();
                }
            });

            // Chat Input & Key Controls
            const chatInput = document.getElementById('chat-input');
            window.addEventListener('keydown', (e) => {
                if (document.activeElement === chatInput) {
                    if (e.code === 'Enter') {
                        sendChatMessage();
                    } else if (e.code === 'Escape') {
                        chatInput.blur();
                        container.requestPointerLock();
                    }
                    return;
                }

                keys[e.code] = true;

                if (e.code === 'KeyT' || e.code === 'Enter') {
                    e.preventDefault();
                    document.exitPointerLock();
                    chatInput.focus();
                }

                if (e.code === 'KeyK') {
                    const dir = new THREE.Vector3(0, 0, -6).applyAxisAngle(new THREE.Vector3(0, 1, 0), localGoose.rotation.y);
                    spawnKanyeNPC(localGoose.position.x + dir.x, localGoose.position.z + dir.z);
                }

                if (e.code === 'Space' && isGrounded) {
                    velocityY = jumpStrength;
                    isGrounded = false;
                }
                if (e.code === 'KeyE') {
                    performMicAttack();
                }
            });
            
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });
            window.addEventListener('mousedown', (e) => {
                if (isPointerLocked && e.button === 0) {
                    performMicAttack();
                }
            });

            animate();
        }

        /* 🎙️ MELEE ATTACK LOGIC */
        function performMicAttack() {
            if (isAttacking) return;
            isAttacking = true;
            attackProgress = 0;

            const honkUI = document.getElementById('honk-text');
            honkUI.innerText = "MIC SLAM!";
            honkUI.style.opacity = '1';
            setTimeout(() => { honkUI.style.opacity = '0'; }, 250);

            if (socket) socket.emit('honk');

            // Hit Detection: Check Kanyes in front of player
            const attackRange = 5.0;
            for (let i = kanyeNPCs.length - 1; i >= 0; i--) {
                const npc = kanyeNPCs[i];
                const dist = localGoose.position.distanceTo(npc.mesh.position);
                
                if (dist <= attackRange) {
                    // Knockback & Defeat
                    scene.remove(npc.mesh);
                    kanyeNPCs.splice(i, 1);
                    score++;
                    document.getElementById('score-count').innerText = score;
                    document.getElementById('kanye-count').innerText = kanyeNPCs.length;
                }
            }
        }

        function animateMicSword() {
            if (!isAttacking) return;
            attackProgress += 0.15;
            
            // Swing slash rotation arc
            micWeaponGroup.rotation.x = 0.2 - Math.sin(attackProgress * Math.PI) * 1.5;
            micWeaponGroup.rotation.y = -0.3 + Math.sin(attackProgress * Math.PI) * 1.2;

            if (attackProgress >= 1) {
                isAttacking = false;
                micWeaponGroup.rotation.set(0.2, -0.3, -0.2);
            }
        }

        function sendChatMessage() {
            const chatInput = document.getElementById('chat-input');
            const msg = chatInput.value.trim();
            if (msg !== "") {
                socket.emit('chatMessage', { nickname: playerNickname, message: msg });
                appendChatMessage(playerNickname, msg);
                chatInput.value = "";
            }
            chatInput.blur();
            document.getElementById('canvas-container').requestPointerLock();
        }

        function appendChatMessage(sender, message) {
            const container = document.getElementById('chat-messages');
            const msgEl = document.createElement('p');
            msgEl.innerHTML = `<span style="color: #ff477e;">[${sender}]</span>: ${message}`;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function createHollowBarn() {
            const barn = new THREE.Group();
            barn.position.set(60, 0, 60);

            const redMat = createToonMaterial(0xcc2222, THREE.DoubleSide);
            const woodMat = createToonMaterial(0x8b5a2b, THREE.DoubleSide);
            const darkRoofMat = createToonMaterial(0x3a1e05, THREE.DoubleSide);

            const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(18, 22), woodMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.y = 0.1;
            barn.add(floorMesh);

            const sideWallGeo = new THREE.BoxGeometry(0.6, 9, 22);
            const leftWall = new THREE.Mesh(sideWallGeo, redMat);
            leftWall.position.set(-9, 4.5, 0);
            attachOutline(leftWall, 1.02);
            barn.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeo, redMat);
            rightWall.position.set(9, 4.5, 0);
            attachOutline(rightWall, 1.02);
            barn.add(rightWall);

            const backWallGeo = new THREE.BoxGeometry(18, 9, 0.6);
            const backWall = new THREE.Mesh(backWallGeo, redMat);
            backWall.position.set(0, 4.5, 11);
            attachOutline(backWall, 1.02);
            barn.add(backWall);

            const frontWallGeo = new THREE.BoxGeometry(6, 9, 0.6);
            const frontLeft = new THREE.Mesh(frontWallGeo, redMat);
            frontLeft.position.set(-6, 4.5, -11);
            attachOutline(frontLeft, 1.02);
            barn.add(frontLeft);

            const frontRight = new THREE.Mesh(frontWallGeo, redMat);
            frontRight.position.set(6, 4.5, -11);
            attachOutline(frontRight, 1.02);
            barn.add(frontRight);

            const roofGeo = new THREE.BoxGeometry(11, 0.5, 23);
            const leftRoof = new THREE.Mesh(roofGeo, darkRoofMat);
            leftRoof.position.set(-4.5, 11, 0);
            leftRoof.rotation.z = 0.35;
            attachOutline(leftRoof, 1.02);
            barn.add(leftRoof);

            const rightRoof = new THREE.Mesh(roofGeo, darkRoofMat);
            rightRoof.position.set(4.5, 11, 0);
            rightRoof.rotation.z = -0.35;
            attachOutline(rightRoof, 1.02);
            barn.add(rightRoof);

            scene.add(barn);
        }

        function setupTwoWayPortals() {
            posOutside.y = getHillHeight(posOutside.x, posOutside.z) + 3.2;

            renderTargetMeadow = new THREE.WebGLRenderTarget(1024, 1024);
            renderTargetBarn = new THREE.WebGLRenderTarget(1024, 1024);

            portalCamToMeadow = new THREE.PerspectiveCamera(75, 1, 0.1, 500);
            portalCamToBarn = new THREE.PerspectiveCamera(75, 1, 0.1, 500);

            const frameGeo = new THREE.TorusGeometry(3, 0.3, 12, 24);
            const frameMatPink = createToonMaterial(0xff0077);
            const frameMatBlue = createToonMaterial(0x00f0ff);
            const screenGeo = new THREE.CircleGeometry(2.8, 32);

            portalBarn = new THREE.Group();
            portalBarn.position.copy(posBarn);

            const frameB = new THREE.Mesh(frameGeo, frameMatPink);
            attachOutline(frameB, 1.05);
            portalBarn.add(frameB);

            portalBarnScreen = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ 
                map: renderTargetMeadow.texture, 
                side: THREE.FrontSide 
            }));
            portalBarn.add(portalBarnScreen);
            scene.add(portalBarn);

            portalOutside = new THREE.Group();
            portalOutside.position.copy(posOutside);

            const frameO = new THREE.Mesh(frameGeo, frameMatBlue);
            attachOutline(frameO, 1.05);
            portalOutside.add(frameO);

            portalOutsideScreen = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ 
                map: renderTargetBarn.texture, 
                side: THREE.FrontSide 
            }));
            portalOutside.add(portalOutsideScreen);
            scene.add(portalOutside);
        }

        function createTerrain() {
            const floorGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 140, 140);
            floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setY(i, getHillHeight(pos.getX(i), pos.getZ(i)));
            }
            floorGeo.computeVertexNormals();

            let colorHex = 0x38b000;
            if (currentMap === "desert") colorHex = 0xe9c46a;
            if (currentMap === "cyber") colorHex = 0x2b0938;

            scene.add(new THREE.Mesh(floorGeo, createToonMaterial(colorHex)));
        }

        function addOtherPlayer(info) {
            const gooseData = buildGooseMesh(info.color, false, info.nickname || "Goose");
            gooseData.group.position.set(info.x, getHillHeight(info.x, info.z), info.z);
            scene.add(gooseData.group);
            otherGeese[info.id] = gooseData;
        }

        function updatePlayerCount() {
            document.getElementById('geese-count').innerText = Object.keys(otherGeese).length + 1;
        }

        function updatePortalCameras() {
            portalCamToMeadow.position.copy(posOutside);
            portalCamToMeadow.rotation.y = localGoose.rotation.y;
            portalCamToMeadow.rotation.x = pitchObject.rotation.x;

            portalBarnScreen.visible = false;
            renderer.setRenderTarget(renderTargetMeadow);
            renderer.render(scene, portalCamToMeadow);
            portalBarnScreen.visible = true;

            portalCamToBarn.position.copy(posBarn);
            portalCamToBarn.rotation.y = localGoose.rotation.y;
            portalCamToBarn.rotation.x = pitchObject.rotation.x;

            portalOutsideScreen.visible = false;
            renderer.setRenderTarget(renderTargetBarn);
            renderer.render(scene, portalCamToBarn);
            portalOutsideScreen.visible = true;

            renderer.setRenderTarget(null);
        }

        function checkPortalTeleport() {
            if (!canTeleport) return;

            if (localGoose.position.distanceTo(posBarn) < 2.5) {
                localGoose.position.set(posOutside.x, getHillHeight(posOutside.x, posOutside.z + 3.5), posOutside.z + 3.5);
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            }
            else if (localGoose.position.distanceTo(posOutside) < 2.5) {
                localGoose.position.set(posBarn.x, 0.1, posBarn.z + 3.5);
                canTeleport = false;
                setTimeout(() => canTeleport = true, 1000);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (document.activeElement !== document.getElementById('chat-input')) {
                let moved = false;
                const moveSpeed = 0.35;

                const moveVector = new THREE.Vector3();
                if (keys['KeyW']) moveVector.z -= 1;
                if (keys['KeyS']) moveVector.z += 1;
                if (keys['KeyA']) moveVector.x -= 1;
                if (keys['KeyD']) moveVector.x += 1;

                if (moveVector.length() > 0) {
                    moveVector.normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), localGoose.rotation.y);
                    localGoose.position.addScaledVector(moveVector, moveSpeed);
                    moved = true;
                }

                velocityY += gravity;
                localGoose.position.y += velocityY;

                const floorY = getHillHeight(localGoose.position.x, localGoose.position.z);
                if (localGoose.position.y <= floorY) {
                    localGoose.position.y = floorY;
                    velocityY = 0;
                    isGrounded = true;
                }

                checkPortalTeleport();

                if (moved) {
                    socket.emit('playerMovement', {
                        x: localGoose.position.x,
                        z: localGoose.position.z,
                        rotation: localGoose.rotation.y
                    });
                }
            }

            animateMicSword();
            updateKanyeNPCs();
            updatePortalCameras();
            renderer.render(scene, mainCamera);
        }

        window.onload = init;
    </script>
</body>
</html>
